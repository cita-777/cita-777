name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAP_TOKEN: ${{ secrets.GOOGLE_MAP_TOKEN }}
    steps:
      - name: Overview metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cita-777
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          filename: metrics-overview.svg

      - name: Achievements and notable contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cita-777
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: metrics-achievements.svg
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request, issue
          plugin_notable_repositories: yes

      - name: Calendar metrics
        if: ${{ false }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cita-777
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: metrics-calendar.svg
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Reactions metrics
        if: ${{ false }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cita-777
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: metrics-reactions.svg
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_limit_issues: 100
          plugin_reactions_limit_discussions: 100
          plugin_reactions_limit_discussions_comments: 100
          plugin_reactions_days: 0
          plugin_reactions_display: absolute
          plugin_reactions_details: percentage

      - name: Languages and starlists metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cita-777
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: metrics-languages.svg
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes

      - name: Stargazers worldmap
        if: ${{ false }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cita-777
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: metrics-stargazers.svg
          plugin_stargazers: yes
          plugin_stargazers_charts: no
          plugin_stargazers_worldmap: yes
          plugin_stargazers_worldmap_token: ${{ env.GOOGLE_MAP_TOKEN }}
          plugin_stargazers_worldmap_sample: 200

      - name: Stargazers fallback
        if: ${{ false }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cita-777
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: metrics-stargazers.svg
          plugin_stargazers: yes
          plugin_stargazers_days: 0
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: graph
